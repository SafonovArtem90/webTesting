name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Публикация отчёта в GitHub Pages требует записи в ветку gh-pages
permissions:
  contents: write

# Один прогон на ветку: незавершённые заменяются новыми
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    # Фиксируем версию: ubuntu-latest переедет на Ubuntu 26 (19.10.2026) — обновляем осознанно
    runs-on: ubuntu-24.04
    env:
      # Настройки окружения: переопределяют значения application.properties
      PLAYWRIGHT_BASE_URL: https://www.saucedemo.com
      PLAYWRIGHT_BROWSER: CHROMIUM
      PLAYWRIGHT_HEADLESS: true
      PLAYWRIGHT_TIMEOUT: 10s
      TESTRUN_RETRY_COUNT: 1
      SCREENSHOT_DIR: build/screenshots
      # Демо-тест (DemoFailureTest) падает намеренно и запускается в каждом прогоне:
      # проверяет отображение ошибки и скриншота в Allure. Сам прогон он не заваливает.
      DEMO_FAIL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout предыдущего отчёта (история Allure)
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .gh-pages-prev
        continue-on-error: true

      - name: Восстановить историю Allure
        run: |
          mkdir -p build/allure-history
          if [ -f .gh-pages-prev/history.jsonl ]; then
            cp .gh-pages-prev/history.jsonl build/allure-history/history.jsonl
            echo "История восстановлена: $(wc -l < build/allure-history/history.jsonl) прогонов"
          else
            echo "Истории ещё нет — первый прогон"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Playwright browsers
        run: ./gradlew playwrightInstall --no-daemon

      - name: Checkstyle
        id: checkstyle
        continue-on-error: true
        run: ./gradlew checkstyleTest --no-daemon

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./gradlew test --no-daemon

      - name: Build Allure report
        if: always() && hashFiles('build/allure-results/*.json') != ''
        run: |
          ./gradlew allureReport --no-daemon
          # История трендов публикуется вместе с отчётом — следующий прогон её прочитает
          cp build/allure-history/history.jsonl build/reports/allure-report/allureReport/history.jsonl

      - name: Publish Allure report to GitHub Pages
        if: always() && hashFiles('build/reports/allure-report/allureReport/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/reports/allure-report/allureReport

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: build/allure-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore

      # Демо-тест упадает намеренно и прогоном не считается; красный — только при
      # реальных падениях, ошибках компиляции/инфраструктуры или проблемах Checkstyle
      - name: Fail the run if tests or checks failed
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "failure" ] && ! ls build/test-results/test/*.xml >/dev/null 2>&1; then
            echo "Тесты не выполнялись: ошибка компиляции или инфраструктуры"
            exit 1
          fi
          if grep -rlE "<failure|<error[ >]" build/test-results/test/*.xml 2>/dev/null | grep -v DemoFailureTest | grep -q .; then
            echo "Есть падения тестов вне DemoFailureTest"
            exit 1
          fi
          if [ "${{ steps.checkstyle.outcome }}" = "failure" ]; then
            echo "Checkstyle завершился с ошибкой"
            exit 1
          fi
          echo "Значимых падений нет (демо-тест упал намеренно)"
