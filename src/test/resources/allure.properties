# Единый каталог результатов Allure для запусков из Gradle и IDEA
# (без файла адаптер из IDEA пишет в ./allure-results, который отчёт не читает)
allure.results.directory=build/allure-results

# Автоочистка каталога перед каждым прогоном: старые результаты не склеиваются
allure.results.clean.before.run=true
